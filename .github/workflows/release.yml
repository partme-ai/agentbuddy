name: build-bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, bundle_glob: "agentbuddy/src-tauri/target/release/bundle/dmg/*.dmg" }
          - { os: windows-latest, bundle_glob: "agentbuddy/src-tauri/target/release/bundle/{nsis,msi}/**" }
          - { os: ubuntu-24.04, bundle_glob: "agentbuddy/src-tauri/target/release/bundle/{appimage,deb}/**" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: agentbuddy
      - uses: actions/checkout@v4
        with:
          repository: partme-ai/workbuddy-agent-experts
          path: workbuddy-agent-experts
          # public repo: default GITHUB_TOKEN only (org policy rejects the PAT)
      - name: Link the experts resource tree (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: rm -rf "$PWD/agentbuddy/experts" && ln -sfn "$PWD/workbuddy-agent-experts/experts" "$PWD/agentbuddy/experts"
      - name: Copy the experts resource tree (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -rf "$PWD/agentbuddy/experts" && cp -R "$PWD/workbuddy-agent-experts/experts" "$PWD/agentbuddy/experts"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agentbuddy/src-tauri
      - name: Upload built bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: ${{ matrix.bundle_glob }}

  upload-release-assets:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload bundles to the v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              gh release upload v1.0.0 "$f" --clobber
              echo "uploaded: $f"
            done
