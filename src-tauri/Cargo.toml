[package]
name = "agentbuddy"
version = "1.0.0"
edition = "2021"
description = "AgentBuddy — WorkBuddy 智能体/专家团跨平台安装器"
authors = ["partme-ai"]
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
