name: build-bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: agentbuddy
      - uses: actions/checkout@v4
        with:
          repository: partme-ai/workbuddy-agent-experts
          path: workbuddy-agent-experts
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}
      - name: Link the experts resource tree
        shell: bash
        run: ln -sfn "$PWD/workbuddy-agent-experts/experts" "$PWD/agentbuddy/experts"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agentbuddy/src-tauri
          target: ${{ matrix.target }}

  upload-release-assets:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload bundles to the v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              gh release upload v1.0.0 "$f" --clobber
              echo "uploaded: $f"
            done
